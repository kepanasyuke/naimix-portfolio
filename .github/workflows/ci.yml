name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify (compile, tests, checkstyle)
        run: mvn -B verify
      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle
          path: "**/target/checkstyle-result.xml"
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Lint
        run: npx eslint assets

  containers:
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      matrix:
        service:
          - auth-service
          - vacancy-service
          - matching-service
          - notification-service
          - billing-service
          - analytics-service
          - ai-assistant-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: false
          tags: naimix/${{ matrix.service }}:${{ github.sha }}
