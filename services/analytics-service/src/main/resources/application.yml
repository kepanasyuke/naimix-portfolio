server:
  port: 8086

spring:
  application:
    name: analytics-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

analytics:
  store: ${ANALYTICS_STORE:memory}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
