server:
  port: 8082

spring:
  application:
    name: vacancy-service
  cache:
    type: ${CACHE_TYPE:simple}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:vacancy;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
